syntax = "proto3";

package collab.sync.v1;

option go_package = "github.com/SrijitGyawali/Collaboration-Engine/gen/collab/sync/v1;syncv1";

// SyncService is the only writer of document state. Gateways call it for
// every edit and to catch clients up after a reconnect.
service SyncService {
  // ApplyOperations stores operations durably and assigns each a per-document
  // sequence number. Retrying an op_id that is already stored returns its
  // original ack instead of applying it twice.
  rpc ApplyOperations(ApplyOperationsRequest) returns (ApplyOperationsResponse);

  // GetOperationsSince streams a document's stored operations after a
  // sequence number, in order, a page per message.
  rpc GetOperationsSince(GetOperationsSinceRequest) returns (stream GetOperationsSinceResponse);

  // GetSnapshot returns the latest snapshot of a document for initial load.
  // Not implemented yet (snapshots arrive with the Kafka workers): the server
  // answers UNIMPLEMENTED.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
}

// ElementId identifies one character for its whole life. Ordered by counter,
// then replica.
message ElementId {
  // Lamport counter; zero only for the document start.
  uint64 counter = 1;
  string replica = 2;
}

enum OpType {
  OP_TYPE_UNSPECIFIED = 0;
  OP_TYPE_INSERT = 1;
  OP_TYPE_DELETE = 2;
}

// Operation mirrors crdt.Op in internal/crdt.
message Operation {
  string doc_id = 1;
  // The string form of id ("counter@replica"). Globally unique; the
  // idempotency key everywhere, including the Postgres unique constraint.
  string op_id = 2;
  OpType type = 3;
  // The operation's own ID. For an insert it is also the new character's ID.
  ElementId id = 4;
  // Insert only: the character this one follows. Unset means document start.
  ElementId after = 5;
  // Insert only: the character, as one Unicode code point.
  string value = 6;
  // Assigned by the sync service; zero until stored.
  int64 seq = 7;
  // Delete only: the character to remove.
  ElementId target = 8;
}

message ApplyOperationsRequest {
  string doc_id = 1;
  // The replica that made the operations, for logs.
  string client_id = 2;
  // At most 1000 per call.
  repeated Operation operations = 3;
}

// Ack is the outcome of one operation, in the same position as in the request.
message Ack {
  string op_id = 1;
  // The operation's place in the document's history; 0 if rejected.
  int64 seq = 2;
  // The operation was already stored; seq is the number it got then.
  bool duplicate = 3;
  // Why the operation was rejected, or empty. Rejected operations are not
  // stored; the client should drop them.
  string error = 4;
}

message ApplyOperationsResponse {
  repeated Ack acks = 1;
}

message GetOperationsSinceRequest {
  string doc_id = 1;
  int64 after_seq = 2;
  // The most operations to return; 0 means all of them.
  int32 limit = 3;
}

message GetOperationsSinceResponse {
  // A page of operations, each with its seq, oldest first.
  repeated Operation operations = 1;
}

message GetSnapshotRequest {
  string doc_id = 1;
}

message GetSnapshotResponse {
  string doc_id = 1;
  // The last sequence number included in state.
  int64 seq = 2;
  // Serialized CRDT state.
  bytes state = 3;
}
