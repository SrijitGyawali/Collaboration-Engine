version: v2
# The plugins run through `go tool`, at the versions pinned in go.mod, so
# everyone generates identical code without installing anything.
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen
    opt: paths=source_relative
