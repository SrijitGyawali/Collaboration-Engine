# Local infrastructure and the application. From the repo root, `make up`
# starts the infrastructure; `make stack` builds and starts everything:
#
#   browser --> proxy :8080 --+--> gateway-a --+
#                             +--> gateway-b --+--gRPC--> sync --> postgres
#                                     ^    ^                |
#                                     +----+----- redis <---+  committed edits
#
# Credentials here are for local development only.
name: collab-engine

# The two gateways are identical apart from their name and debug port.
x-gateway: &gateway
  build:
    context: ..
    args:
      SERVICE: gateway
  image: collab-engine-gateway
  environment:
    SYNC_GRPC_TARGET: sync:9090
    # Where each gateway hears about edits made through the other one.
    REDIS_ADDR: redis:6379
    GATEWAY_ADDR: ":8080"
    GATEWAY_ALLOWED_ORIGINS: localhost:3000
  # gRPC connects lazily and retries, so a gateway may start before the sync
  # service is ready. Redis is checked at startup, so it must be up.
  depends_on:
    sync:
      condition: service_started
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Without this, a Docker restart brought back the application but not
    # its database, and the sync service crash-looped.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Kafka-compatible broker; lighter than Kafka for local development.
  redpanda:
    image: redpandadata/redpanda:v25.3.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 40

  # The application, built from this repository.
  sync:
    build:
      context: ..
      args:
        SERVICE: sync
    environment:
      DATABASE_URL: postgres://collab:collab@postgres:5432/collab?sslmode=disable
      # Committed edits are published here for the gateways.
      REDIS_ADDR: redis:6379
      SYNC_GRPC_ADDR: ":9090"
      SYNC_HTTP_ADDR: ":8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Each gateway is also published on its own port, so tests and demos can
  # put two editors on different gateways on purpose. Browsers use the proxy.
  gateway-a:
    <<: *gateway
    ports:
      - "127.0.0.1:${GATEWAY_A_PORT:-8091}:8080"

  gateway-b:
    <<: *gateway
    ports:
      - "127.0.0.1:${GATEWAY_B_PORT:-8092}:8080"

  # The one address browsers connect to; see Caddyfile.
  proxy:
    image: caddy:2.11.9-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - gateway-a
      - gateway-b
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot: `make migrate`.
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://collab:collab@postgres:5432/collab?sslmode=disable
      - up

volumes:
  pgdata:
  redpanda:
