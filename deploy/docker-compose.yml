# Local infrastructure. Start with `make up` from the repo root.
# Credentials here are for local development only.
name: collab-engine

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Kafka-compatible broker; lighter than Kafka for local development.
  redpanda:
    image: redpandadata/redpanda:v25.3.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 40

  # The application, built from this repository. `make stack` builds and
  # starts it with everything above; `make up` starts only the infrastructure.
  sync:
    build:
      context: ..
      args:
        SERVICE: sync
    environment:
      DATABASE_URL: postgres://collab:collab@postgres:5432/collab?sslmode=disable
      SYNC_GRPC_ADDR: ":9090"
      SYNC_HTTP_ADDR: ":8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ..
      args:
        SERVICE: gateway
    environment:
      SYNC_GRPC_TARGET: sync:9090
      GATEWAY_ADDR: ":8080"
      GATEWAY_ALLOWED_ORIGINS: localhost:3000
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    # gRPC connects lazily and retries, so the gateway may start before the
    # sync service is ready.
    depends_on:
      - sync
    restart: unless-stopped

  # One-shot: `make migrate`.
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://collab:collab@postgres:5432/collab?sslmode=disable
      - up

volumes:
  pgdata:
  redpanda:
