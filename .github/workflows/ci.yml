name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          {
            echo '### Test coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build services
        run: make build
      - name: Build WebAssembly
        run: make wasm

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  proto:
    name: gRPC contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # buf lint, then regenerate gen/ and fail if it differs from what is
      # committed: someone changed sync.proto without running make proto.
      - name: Lint and check generated code
        run: make proto-check

  images:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [sync, gateway]
    steps:
      - uses: actions/checkout@v5
      # The same Dockerfile and build argument that docker compose uses.
      - name: Build the ${{ matrix.service }} image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t collab-${{ matrix.service }}:ci .

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tests and the build both need the module and Go's wasm_exec.js.
      - name: Build the CRDT WebAssembly module
        run: make web-wasm
        working-directory: .
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Generates Next.js route types (LayoutProps and friends) first; on a
      # fresh checkout they do not exist until next dev, build or typegen.
      - name: Type-check
        run: npm run typecheck
      - name: Test the WebAssembly bridge
        run: npm test
      - name: Build
        run: npm run build

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fuzz the CRDT
        run: make fuzz FUZZTIME=60s
      # A failing input is saved under testdata/fuzz; keep it so it can be
      # downloaded, committed and replayed as a regression test.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: internal/crdt/testdata/fuzz
